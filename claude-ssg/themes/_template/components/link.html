<!--
    Composant: link
    Description: Lien hypertexte

    Paramètres:
    - {{href}}: URL de destination
    - {{text}}: Texte du lien
    - {{external}}: true si lien externe (optionnel)
    - {{title}}: Attribut title (optionnel)
-->
<a href="{{href}}" class="link{{#if external}} link--external{{/if}}"{{#if external}} target="_blank" rel="noopener noreferrer"{{/if}}{{#if title}} title="{{title}}"{{/if}}>
    {{text}}
    {{#if external}}<span class="link-external-icon" aria-hidden="true">↗</span>{{/if}}
</a>
