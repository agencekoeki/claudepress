<!--
    Composant: divider
    Description: Séparateur horizontal

    Paramètres:
    - {{style}}: Style: solid, dashed, dotted (défaut: solid)
    - {{spacing}}: Espacement: small, medium, large (défaut: medium)
-->
<hr class="divider divider--{{style|solid}} divider--spacing-{{spacing|medium}}" aria-hidden="true">
