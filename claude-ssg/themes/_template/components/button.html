<!--
    Composant: button
    Description: Bouton d'action

    Paramètres:
    - {{text}}: Texte du bouton
    - {{href}}: URL si lien (optionnel)
    - {{type}}: Type si formulaire: submit, button, reset (optionnel)
    - {{variant}}: Variante: primary, secondary, outline (défaut: primary)
    - {{size}}: Taille: small, medium, large (défaut: medium)
    - {{disabled}}: true si désactivé (optionnel)
-->
{{#if href}}
<a href="{{href}}" class="button button--{{variant|primary}} button--{{size|medium}}{{#if disabled}} button--disabled{{/if}}"{{#if disabled}} aria-disabled="true"{{/if}}>
    {{text}}
</a>
{{else}}
<button type="{{type|button}}" class="button button--{{variant|primary}} button--{{size|medium}}"{{#if disabled}} disabled{{/if}}>
    {{text}}
</button>
{{/if}}
